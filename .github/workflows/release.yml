name: Release macOS DMG

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  build-and-release:
    name: Build and Release DMG
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build and bundle app
        run: make bundle

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "SuperVibe" \
            -srcfolder SuperVibe.app \
            -ov \
            -format UDZO \
            SuperVibe.dmg

      - name: Create and push tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ github.event.inputs.tag }}" || true
          git push origin "${{ github.event.inputs.tag }}" || true

      - name: Upload DMG to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: SuperVibe ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          files: SuperVibe.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
